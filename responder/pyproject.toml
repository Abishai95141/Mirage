[project]
name = "mirage-responder"
version = "0.1.0"
description = "MIRAGE responder: answers the commands an SSH decoy has nothing for (phase 3)"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["mirage-schema", "fastapi>=0.115", "uvicorn>=0.32", "pyyaml>=6.0", "httpx>=0.28"]

[project.scripts]
mirage-responder = "mirage_responder.main:main"
# A scripted stand-in for the model server, for tests of the whole path. Not a model.
mirage-llm-stub = "mirage_responder.stub:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage_responder"]

[tool.uv.sources]
mirage-schema = { workspace = true }
