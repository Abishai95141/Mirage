# Commands promoted from the live model's answers to the render library (phase 3 spec
# 3.2b). Written by `make render-candidates` from the responder's cache: stateless
# commands the model was asked, each one plain command. `make render-record` asks the
# reference host for each, and `make render-library` makes an entry of every answer
# that is fixed. `answered` is how often the responder was asked for the command;
# `left` is why the reference host's answer could not be an entry (the command then
# stays with the responder). Delete an entry to have it considered afresh.
- argv: apt-cache show bash
  answered: 1
  left: the reference container's package database contradicts the decoy's process
    list until the image is rebased (known gaps emulator.dpkg-l and emulator.dpkg-s)
- argv: chage -l caleb
  answered: 1
  left: 'it names an account of the deployment, and the recording host has none of
    them: it answered that the user does not exist'
- argv: dpkg -L bash
  answered: 1
  left: the reference container's package database contradicts the decoy's process
    list until the image is rebased (known gaps emulator.dpkg-l and emulator.dpkg-s)
- argv: dpkg -s openssh-server
  answered: 1
  left: the reference container's package database contradicts the decoy's process
    list until the image is rebased (known gaps emulator.dpkg-l and emulator.dpkg-s)
- argv: getent group root
  answered: 1
  left: 'a function of the deployment''s own files (/etc/passwd, /etc/group, /etc/hosts),
    not of the image: it belongs in the emulator'
- argv: getent group sudo
  answered: 1
  left: 'a function of the deployment''s own files (/etc/passwd, /etc/group, /etc/hosts),
    not of the image: it belongs in the emulator'
