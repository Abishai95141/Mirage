[project]
name = "mirage-profiles"
version = "0.1.0"
description = "MIRAGE host profiles: Debian reference facts and the per-deployment generator"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["mirage-schema", "mirage-tokens", "pyyaml>=6.0", "faker>=30"]

[project.scripts]
mirage-profile = "mirage_profiles.generator:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage_profiles"]

[tool.uv.sources]
mirage-schema = { workspace = true }
mirage-tokens = { workspace = true }
