[project]
name = "mirage-tokens"
version = "0.1.0"
description = "MIRAGE honeytokens: minted at profile render time, matched in the pipeline"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = []

[project.scripts]
mirage-tokens = "mirage_tokens.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage_tokens"]
