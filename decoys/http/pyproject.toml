[project]
name = "mirage-http-decoy"
version = "0.1.0"
description = "MIRAGE HTTP decoy: nginx-identical framing over h11, every request gated"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["mirage-schema", "mirage-decoy-common", "h11>=0.14"]

[project.scripts]
mirage-http-decoy = "mirage_http_decoy.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage_http_decoy"]

[tool.uv.sources]
mirage-schema = { workspace = true }
mirage-decoy-common = { workspace = true }
