[project]
name = "mirage-decoy-common"
version = "0.1.0"
description = "Shared pieces of the MIRAGE decoys: PROXY v2, gate client, event log, artifacts"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["mirage-schema", "httpx>=0.28"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage_decoy_common"]

[tool.uv.sources]
mirage-schema = { workspace = true }
