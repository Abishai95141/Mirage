# Host, account, network and process discovery: written for the Phase 2 catalogue (spec 2.1).
attack_version: "20.1"
procedures:
  - id: sysinfo-os-release
    technique: T1082
    tactic: TA0007
    source: own
    protocol: ssh
    template: cat /etc/os-release
  - id: sysinfo-hostname
    technique: T1082
    tactic: TA0007
    source: atomic
    protocol: ssh
    template: hostname
    ref: ART T1082 test 8 Hostname Discovery (486e88ea-4f56-470f-9b57-3f4d73f39133)
