    technique: T1082
    tactic: TA0007
    source: corpus
    protocol: ssh
    template: uname -s -v -n -r -m
  - id: sysinfo-uname-machine
    technique: T1082
    tactic: TA0007
    source: corpus
    protocol: ssh
    template: uname -m
  - id: sysinfo-cpu-count
    technique: T1082
    tactic: TA0007
    source: corpus
    protocol: ssh
    template: cat /proc/cpuinfo | grep name | wc -l
