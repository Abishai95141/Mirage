id: smoke-mysql-read
actor: {class: scripted_bot, timing: bot-fast, patience: 3}
sessions:
  - protocol: mysql
    login: {user: wp_user, procedure: mysql-login}
    steps:
      - {id: s1, procedure: mysql-select-one, expect: "1"}
      - {id: s2, procedure: mysql-show-databases, expect: "crm"}
      - {id: s3, procedure: mysql-count-rows}
