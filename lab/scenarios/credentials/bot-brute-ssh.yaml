# A bot that guesses its way in through SSH, then prepares a sudo-capable account.
id: bot-brute-ssh
actor: {class: scripted_bot, timing: bot-fast, patience: 6}
sessions:
  - protocol: ssh
    channel: exec
    login: {user: root, guesses: 8, procedure: ssh-password-guessing}
    steps:
      - {id: s1, procedure: brute-sudo-prep, with: {user: svc}}
      - {id: s2, procedure: spray-medusa}
