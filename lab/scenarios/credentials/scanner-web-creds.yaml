# A scanner that reads exposed application secrets and sprays the login forms.
id: scanner-web-creds
actor: {class: scanner, timing: scan, patience: 4}
sessions:
  - protocol: http
    steps:
      - {id: s1, procedure: web-get-index, expect: "200"}
      - {id: s2, procedure: web-get-login-page}
      - {id: s3, procedure: creds-http-env, expect: "DB_", on_fail: continue}
      - {id: s4, procedure: spray-http-login, with: {user: admin}}
      - {id: s5, procedure: spray-http-pma}
