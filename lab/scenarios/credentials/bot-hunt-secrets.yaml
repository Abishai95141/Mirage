# Post-access credential hunting: application secrets, keys and account databases.
id: bot-hunt-secrets
actor: {class: scripted_bot, timing: bot-fast, patience: 4}
sessions:
  - protocol: ssh
    channel: shell
    login: {user: root, guesses: 2, procedure: ssh-password-guessing}
    steps:
      - {id: s1, procedure: creds-cat-env, expect: "DB_", on_fail: continue}
      - {id: s2, procedure: creds-find-env, with: {dir: /var/www}}
      - {id: s3, procedure: creds-write-read}
      - {id: s4, procedure: keys-find-rsa, with: {dir: /root}}
      - {id: s5, procedure: keys-find-tls}
      - {id: s6, procedure: keys-archive-ssh}
      - {id: s7, procedure: dump-shadow-file}
      - {id: s8, procedure: dump-passwd-copy}
      - {id: s9, procedure: dump-getent-shadow}
