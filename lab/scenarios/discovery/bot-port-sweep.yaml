# A bot that logs in and enumerates listening services from a shell. (Labelled a scanner
# until the first live run: by the class definitions, authenticated activity is a bot's.)
id: bot-port-sweep
actor: {class: scripted_bot, timing: bot-fast, patience: 4}
sessions:
  - protocol: ssh
    channel: exec
    login: {user: root, guesses: 4, procedure: ssh-password-guessing}
    steps:
      - {id: s1, procedure: scan-nmap-single, with: {port: "22"}}
      - {id: s2, procedure: scan-nmap-syn, with: {port: "3306"}}
      - {id: s3, procedure: scan-ports-devtcp}
      - {id: s4, procedure: scan-port-nc-timeout, with: {port: "6379"}}
