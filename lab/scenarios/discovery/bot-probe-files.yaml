# A bot that walks the filesystem after landing.
id: bot-probe-files
actor: {class: scripted_bot, timing: bot-fast, patience: 3}
sessions:
  - protocol: ssh
    channel: shell
    login: {user: root, guesses: 2, procedure: ssh-password-guessing}
    steps:
      - {id: s1, procedure: change-dir, with: {dir: /etc}}
      - {id: s2, procedure: files-list-dir, with: {dir: /etc}}
      - {id: s3, procedure: files-find-hidden, with: {dir: /root}}
      - {id: s4, procedure: files-find-recent, with: {dir: /var/log}}
      - {id: s5, procedure: files-which-ls}
      - {id: s6, procedure: files-which-sh}
