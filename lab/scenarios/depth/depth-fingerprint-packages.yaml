# Generated depth scenario scaffold; gates annotated here.
# Depth: the package and service-config route, with an identity fallback.
# Gates: s1 recon (ssh package), s2 version (nginx; falls back to s5),
# s5 fact (/etc/issue), s6 group fact (falls back to s9), s9 setuid route.
# Read-only; exec channel.

id: depth-fingerprint-packages
actor:
  class: human
  timing: human
  patience: 1
sessions:
