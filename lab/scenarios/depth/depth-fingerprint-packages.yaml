    expect: ok0
  - id: s5
    procedure: d-issue-check
    expect: ok0
    on_fail: leave
  - id: s6
    procedure: d-shadow-group
    expect: ok0
    on_fail:
      goto: s9
  - id: s7
    procedure: d-tmp-sticky
    expect: ok0
  - id: s8
    procedure: d-nobody-uid
    expect: ok0
  - id: s9
    procedure: d-find-setuid
    expect: ok0
    on_fail:
      goto: s12
  - id: s10
    procedure: d-lsmod-shape
