# Generated depth scenario scaffold; gates annotated here.
# Depth: the lateral-movement route - ssh, scp and keyscan against a host that
# cannot answer; the failure itself is the gate. ssh-keyscan comes from
# openssh-client; bash's /dev/tcp stands in for fetchers.
# Gates: s1 ssh fails, s2 keyscan finds nothing (falls back to s5), s4 route,
# s6 scp fails (falls back to s9), s8 dns fails, s10 fetch fails.
# Human-paced: patience 3.

id: depth-egress-lateral
actor:
  class: human
  timing: human
  patience: 3
sessions:
- protocol: ssh
  channel: exec
  login:
    user: root
  steps:
  - id: s1
    procedure: d-ssh-remote-fail
    expect: no[0-9]+
    on_fail:
      goto: s4
  - id: s2
    procedure: d-keyscan-fail
    expect: no[0-9]+
    on_fail:
      goto: s5
  - id: s3
    procedure: d-iface-shape
    expect: ok0
  - id: s4
    procedure: d-scp-remote-fail
    expect: no[0-9]+
    on_fail:
      goto: s7
  - id: s5
    procedure: d-route-shape
    expect: ok0
  - id: s6
    procedure: d-resolv-shape
    expect: ok0
  - id: s7
    procedure: d-dns-fail
    expect: no[0-9]+
    on_fail:
      goto: s10
  - id: s8
    procedure: d-tcp-probe-fail
    expect: no[0-9]+
  - id: s9
    procedure: d-port-sweep
    expect: sweep[0-9]+
    on_fail:
      goto: s11
  - id: s10
    procedure: d-fetch-attempt
    expect: no[0-9]+
    on_fail: leave
  - id: s11
    procedure: d-tar-exfil-fail
    expect: no[0-9]+
    on_fail: leave
