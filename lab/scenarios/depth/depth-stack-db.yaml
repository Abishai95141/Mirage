# Generated depth scenario scaffold; gates annotated here.
# Depth: the database half. The local-socket probes are the valid-account rung.
# Gates: s1 mysqladmin ping (falls back to s5), s3 SELECT VERSION(),
# s5 SELECT 1 as the fixed local account (falls back to s8), s7 redis set+get
# state pair, s8 sshd still listening (consistency with s1's earlier answer).
# Exec channel.

id: depth-stack-db
actor:
  class: scripted_bot
  timing: bot-slow
  patience: 2
sessions:
- protocol: ssh
  channel: exec
  login:
    user: root
  steps:
