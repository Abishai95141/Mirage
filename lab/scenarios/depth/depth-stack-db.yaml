    expect: ok0
  - id: s5
    procedure: d-mysql-select
    expect: ok0
    on_fail:
      goto: s8
  - id: s6
    procedure: d-debincnf-cred
    expect: ok0
  - id: s7
    procedure: d-redis-set-get
    expect: ok0
    on_fail:
      goto: s9
  - id: s8
    procedure: d-ss-ssh
    expect: ok0
    on_fail: leave
  - id: s9
