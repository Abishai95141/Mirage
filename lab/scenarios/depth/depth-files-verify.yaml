# Generated depth scenario scaffold; gates annotated here.
# Depth: a human-paced verification walk over what the session created.
# Gates: s2 state (write), s3 read-back (falls back to s6), s5 find,
# s6 copy consistency (falls back to s9), s8 archive roundtrip, s11 move state.
# Shell channel.

id: depth-files-verify
actor:
  class: human
  timing: human
  patience: 3
sessions:
- protocol: ssh
  channel: shell
  login:
    user: root
  steps:
  - id: s1
    procedure: d-workdir-make
    expect: ok0
    on_fail: leave
  - id: s2
    procedure: d-secret-write
    expect: ok0
    on_fail: leave
  - id: s3
    procedure: d-secret-readback
    expect: ok0
    on_fail:
      goto: s6
  - id: s4
    procedure: d-file-listed
    expect: ok0
  - id: s5
    procedure: d-file-found
    expect: ok0
    on_fail:
      goto: s8
  - id: s6
    procedure: d-copy-same
    expect: ok0
    on_fail:
      goto: s9
  - id: s7
    procedure: d-hostcopy-read
    expect: ok0
  - id: s8
    procedure: d-tar-roundtrip
    expect: ok0
    on_fail:
      goto: s11
  - id: s9
    procedure: d-gzip-roundtrip
    expect: ok0
    on_fail:
      goto: s12
  - id: s10
    procedure: d-file-sha
    expect: ok0
  - id: s11
    procedure: d-stage-move
    expect: ok0
    on_fail:
      goto: s13
  - id: s12
    procedure: d-file-count
    expect: ok0
  - id: s13
    procedure: d-pwd-holds
    expect: ok0
    on_fail: leave
