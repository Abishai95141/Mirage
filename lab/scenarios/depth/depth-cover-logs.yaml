# Generated depth scenario scaffold; gates annotated here.
# Depth: the shell-history arc - create it, prove it, clear it, prove it empty.
# Gates: s2 state (the history has the marker), s4 state (empty after clear),
# s5 state (the log arc; falls back to s8), s8 shred (falls back to s11),
# s10 renamed binary runs, s13 setuid (falls back to s15), s15 immutable attr.

id: depth-cover-logs
actor:
  class: human
  timing: human
  patience: 1
sessions:
