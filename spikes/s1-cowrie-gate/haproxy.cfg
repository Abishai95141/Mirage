global
    maxconn 256
defaults
    mode tcp
    timeout connect 5s
    timeout client 10m
    timeout server 10m
resolvers docker
    nameserver dns 127.0.0.11:53
frontend gated
    bind :2224
    default_backend gated
frontend stock
    bind :2225
    default_backend stock
backend gated
    server g cowrie-gated:2222 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
backend stock
    server s cowrie-stock:2222 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
