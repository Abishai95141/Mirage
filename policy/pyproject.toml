[project]
name = "mirage-policy"
version = "0.1.0"
description = "MIRAGE policy service: decides how a decoy answers each input (gate contract v1)"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["mirage-schema", "fastapi>=0.115", "uvicorn>=0.32", "pyyaml>=6.0"]

[project.scripts]
mirage-policy = "mirage_policy.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage_policy"]

[tool.uv.sources]
mirage-schema = { workspace = true }
