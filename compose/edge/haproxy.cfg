# edge: the only container attached to both the attacker-facing network and the decoy
# network. It forwards TCP and nothing else: no HTTP parsing, so malformed requests reach the
# HTTP decoy and are answered as nginx would answer them.
#
# The client's address reaches every decoy in a PROXY v2 header (Cowrie listens with a
# "haproxy:" endpoint; the decoys MIRAGE writes refuse connections without one). Only this
# edge can reach the decoys, so the header cannot be forged from outside. On Docker Desktop the "client" is the Docker VM's gateway, not the Mac itself.

global
    log stdout format raw local0 info
    # Without this HAProxy sizes itself from the container's file-descriptor limit and fills
    # its memory limit.
    maxconn 512

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend ssh
    bind :2222
    default_backend cowrie

backend cowrie
    # Docker networks here are dual-stack; Cowrie listens on IPv4 only.
    server cowrie cowrie:2222 send-proxy-v2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

frontend http
    bind :8080
    default_backend http_decoy

backend http_decoy
    server http http-decoy:8080 send-proxy-v2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
