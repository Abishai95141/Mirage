# arm-r-edge: the lab's way in to arm R, the real reference host of phase 3's depth comparison
# (docs/06-phase-3-spec.md, section 5).
#
# It stands where lab-edge stands, on the lab network, so the scenario runner reaches it under
# the same isolation check and speaks to it the same way: it accepts the runner's PROXY v2
# header. A real sshd knows nothing of that header, so it is dropped here and the connection
# is passed on plain. The simulated source address is lost, which is right: this arm has no
# pipeline and no label join, and is measured from the runner's own records.
#
# The reference host is recreated for every scenario and its address may change, so the
# backend is resolved through Docker's DNS, not once at start.

global
    log stdout format raw local0 info
    maxconn 64

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s

frontend ssh
    bind :2222 accept-proxy
    default_backend reference

backend reference
    server ref arm-r:22 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
