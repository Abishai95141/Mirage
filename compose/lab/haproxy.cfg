# lab-edge: the simulation lab's way in to the decoys (docs/05-phase-2-spec.md section 2).
#
# Unlike the real edge it ACCEPTS a PROXY v2 header from its client and passes that source
# address on. The scenario runner uses this to give every simulated actor its own address.
# That trust is safe only because the runner is the sole client: this container exists under
# the compose profile "lab", on an internal network that holds nothing but the runner. It must
# never run on an exposed sensor.

global
    log stdout format raw local0 info
    maxconn 512

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend ssh
    bind :2222 accept-proxy
    default_backend cowrie

backend cowrie
    server cowrie cowrie:2222 send-proxy-v2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

frontend http
    bind :8080 accept-proxy
    default_backend http_decoy

backend http_decoy
    server http http-decoy:8080 send-proxy-v2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

frontend redis
    bind :6379 accept-proxy
    default_backend redis_decoy

backend redis_decoy
    server redis redis-decoy:6379 send-proxy-v2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

frontend mysql
    bind :3306 accept-proxy
    default_backend mysql_decoy

backend mysql_decoy
    server mysql mysql-decoy:3306 send-proxy-v2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
