# The lab's way in to the second deployment of the fingerprint suite's fleet group (phase 3
# spec 3.4). It listens for the prober's PROXY header on the lab network and passes it on to
# that decoy, which is alone with this proxy on the arm network.

global
    log stdout format raw local0 info
    maxconn 64

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s

frontend ssh
    bind :2222 accept-proxy
    default_backend fleet

backend fleet
    server fleet cowrie-fleet:2222 send-proxy-v2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
