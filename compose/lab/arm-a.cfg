# arm-a-edge: the lab's way in to arm A, stock Cowrie, the negative control of phase 3's depth
# comparison (docs/06-phase-3-spec.md, section 5). As arm-r-edge: it accepts the runner's
# PROXY v2 header and passes the connection on plain, because unpatched Cowrie knows nothing
# of that header.

global
    log stdout format raw local0 info
    maxconn 64

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s

frontend ssh
    bind :2222 accept-proxy
    default_backend stock

backend stock
    server stock arm-a:2222 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
