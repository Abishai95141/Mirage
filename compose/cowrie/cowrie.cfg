# Fixed MIRAGE settings, layered over Cowrie's cowrie.cfg.dist (v3.1.6) and over the
# deployment's rendered profile (/etc/cowrie/cowrie.cfg in the image: hostname, versions,
# kernel, algorithms, filesystem). Nothing here is per-deployment.

[ssh]
# No port forwarding: an emulated host has no business proxying traffic, and the forwarding
# path is the only runtime user of Cowrie's FoxIO-licensed JA4+ code.
forwarding = false
# The edge sends a PROXY v2 header, so Cowrie logs the client's address, not the edge's.
listen_endpoints = haproxy:tcp:2222:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[mirage]
# Gate contract v1 (docs/04-phase-1-spec.md section 3). The token comes from the environment
# as COWRIE_MIRAGE_POLICY_TOKEN.
policy_enabled = true
policy_url = http://policy:8000/v1/decide
policy_timeout_ms = 50
# Under the policy service's 75 s keep-alive, so connections outlast an attacker's pause.
policy_idle_ms = 60000
# The responder (phase 3): asked only when the policy answers `respond`, which it does only
# for a decoy that lists it, which this one does only while the responder is healthy.
responder_enabled = true
responder_url = http://responder:8100/v1/respond
