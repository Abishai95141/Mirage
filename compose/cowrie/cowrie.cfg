# Overrides on top of Cowrie's cowrie.cfg.dist (v3.1.6).
#
# Phase 0 runs Cowrie close to stock on purpose: the default-profile tells (hostname svr04,
# user phil, mismatched SSH version strings, 2024 kernel string) are removed in phase 1,
# work package 1.3, and the probe suite needs a stock baseline to measure against.

[ssh]
# No port forwarding: an emulated host has no business proxying traffic, and the forwarding
# path is the only runtime user of Cowrie's FoxIO-licensed JA4+ code.
forwarding = false
# ssh-edge sends a PROXY v2 header, so Cowrie logs the client's address, not the edge's.
listen_endpoints = haproxy:tcp:2222:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
