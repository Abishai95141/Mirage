# NATS server configuration (compose/docker-compose.yml, service nats).
#
# JetStream's file-store limit is set here and not left to the server. Left alone, the server
# takes three quarters of whatever disk is free when it starts, so the limit differs between
# hosts and between restarts. Every stream reserves its max_bytes against that limit, and a
# stream that does not fit is refused ("insufficient storage resources available"). On a CI
# runner with about 6 GB free the third stream was refused and the pipeline never started.
#
# The limit must cover the sum of the streams' max_bytes (mirage_pipeline.normaliser.STREAMS,
# 5 GB today); a unit test checks that. It is a budget, not a measurement: the caps only hold
# on a host that has this much disk free.
http_port: 8222

jetstream {
  store_dir: "/data"
  max_file_store: 6GB
}
