# showcase-proxy: the one thing the public link reaches (docs/08-showcase.md).
#
# Two destinations and nothing else. Any path under /console goes to the console, and only
# for a request that carries the console's password: one without it is answered here and
# never reaches the terminal server. Everything else goes to the read-only Grafana.
#
# The password is read from the environment. It is the same one the console checks itself:
# the console refuses any request that does not carry it, so nothing else on its networks
# can use it, and a mistake in the rules below would not by itself open it.

global
    log stdout format raw local0 info
    maxconn 512

.if !defined(CONSOLE_PASSWORD)
    .alert "no CONSOLE_PASSWORD in the environment: the console would be open; refusing to start"
.endif
.if streq("${CONSOLE_PASSWORD}","")
    .alert "CONSOLE_PASSWORD is empty: the console would be open; refusing to start"
.endif

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor if-none
    timeout connect 5s
    timeout http-request 10s
    timeout client 60s
    timeout server 60s
    # A terminal is one long connection. A session ends by itself after 15 minutes.
    timeout tunnel 20m

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

userlist console
    user presenter insecure-password "${CONSOLE_PASSWORD}"

frontend showcase
    bind :8080
    monitor-uri /-/proxy-health

    acl to_console path_beg /console/
    acl has_login req.hdr(authorization) -m found
    acl signed_in http_auth(console)
    # A browser that has signed in is handed a ticket, and may show it in place of the
    # password. The terminal's own connection needs this: some browsers (Safari, so every
    # iPhone) do not send a saved password on a WebSocket, but all of them send a cookie.
    # The ticket is a hash of the password, so only someone who signed in can hold one, and
    # it stops working when the password is replaced.
    http-request set-var(txn.ticket) env(CONSOLE_PASSWORD),concat(":mirage-console-ticket"),sha2(256),hex,lower
    acl has_ticket req.cook(mirage_console),secure_memcmp(txn.ticket)

    # Who is asking: the visitor's address as the tunnel reports it, else the peer's.
    http-request set-var(txn.visitor) req.hdr(cf-connecting-ip)
    http-request set-var(txn.visitor) src unless { var(txn.visitor) -m found }
    stick-table type string len 64 size 20k expire 10m store http_req_rate(10s),gpc0_rate(1m)
    http-request track-sc0 var(txn.visitor)

    # The console lives under /console/, so a browser offers its password to those pages
    # and to no others.
    http-request redirect code 302 location /console/ if { path /console }

    # One visitor cannot take the whole machine's attention. The store has its own limits.
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 600 }
    # Wrong passwords: ten in a minute from one visitor, then that visitor waits.
    http-request deny deny_status 429 if to_console { sc_gpc0_rate(0) gt 10 }
    http-request sc-inc-gpc0(0) if to_console has_login !signed_in
    http-request auth realm "MIRAGE console" if to_console !signed_in !has_ticket
    http-request set-var(txn.hand_ticket) bool(true) if to_console signed_in
    http-request set-var(txn.https) bool(true) if { req.hdr(x-forwarded-proto) -i https }
    # The console wants the password on every request, the terminal's connection included.
    # For a request whose ticket has just been checked, and for no other, it is put there.
    # A request that came with the password keeps its own, and the console checks that one.
    http-request set-var(txn.pw) env(CONSOLE_PASSWORD)
    http-request set-var(txn.basic) str(presenter:),concat(,txn.pw),base64
    http-request set-header Authorization "Basic %[var(txn.basic)]" if to_console has_ticket !signed_in

    # The ticket: for the console's pages only, never readable by a page's scripts, never
    # sent on a request another site started, and over HTTPS only when the visitor came
    # that way (the preview on this machine is plain HTTP).
    http-response add-header Set-Cookie "mirage_console=%[var(txn.ticket)]; Path=/console/; Max-Age=3600; HttpOnly; SameSite=Strict; Secure" if { var(txn.hand_ticket) -m bool } { var(txn.https) -m bool }
    http-response add-header Set-Cookie "mirage_console=%[var(txn.ticket)]; Path=/console/; Max-Age=3600; HttpOnly; SameSite=Strict" if { var(txn.hand_ticket) -m bool } !{ var(txn.https) -m bool }

    # Nothing here is for search engines, and neither page may be framed by another site.
    http-response set-header X-Robots-Tag "noindex, nofollow"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header Referrer-Policy "no-referrer"

    use_backend console if to_console
    default_backend dashboards

backend dashboards
    # Grafana is told nothing about who signed in to the console: it takes no logins.
    http-request del-header Authorization
    server grafana grafana-public:3000 maxconn 256 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

backend console
    # The ticket is the proxy's business; the console never sees it.
    http-request del-header Cookie
    server console showcase-console:7681 maxconn 16 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
