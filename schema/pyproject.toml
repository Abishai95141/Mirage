[project]
name = "mirage-schema"
version = "0.1.0"
description = "MIRAGE normalised event schema (OCSF-aligned) and source mappings"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["pydantic>=2.9,<3"]

[project.scripts]
mirage-schema-export = "mirage_schema.export:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage_schema"]
