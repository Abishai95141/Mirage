[project]
name = "mirage"
version = "0.0.0"
description = "MIRAGE adaptive honeypot platform (workspace root)"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["schema", "pipeline", "policy", "decoys/common", "decoys/profiles", "decoys/tokens", "decoys/http", "decoys/db", "lab", "intel", "responder"]

[tool.uv.sources]
mirage-schema = { workspace = true }
mirage-pipeline = { workspace = true }
mirage-policy = { workspace = true }
mirage-decoy-common = { workspace = true }
mirage-profiles = { workspace = true }
mirage-tokens = { workspace = true }
mirage-http-decoy = { workspace = true }
mirage-db-decoy = { workspace = true }
mirage-lab = { workspace = true }
mirage-intel = { workspace = true }
mirage-responder = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mirage-schema",
    "mirage-pipeline",
    "mirage-policy",
    "mirage-decoy-common",
    "mirage-profiles",
    "mirage-tokens",
    "mirage-http-decoy",
    "mirage-db-decoy",
    "mirage-lab",
    "mirage-intel",
    "mirage-responder",
    "redis>=5.2",
    "pymysql>=1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "paramiko>=3.5",
    "httpx>=0.28",
    "pre-commit>=4.0",
]
# The model experiments of docs/experiments/ and the tagger's neural layers: a text-embedding
# stack and experiment tracking. Not installed by default (`uv sync --group research`); the
# unit and `ml` test jobs do not need it. On Linux the lock names PyTorch's CPU build, which
# is what CI and a host without a GPU install. A lab host with an NVIDIA GPU gets a second
# environment with the same versions and the CUDA build: `make gpu-env`, then `GPU=1`.
research = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.24",
    "mlflow>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["schema/tests", "pipeline/tests", "policy/tests", "decoys", "lab", "intel", "responder", "tests", "eval"]
markers = [
    "integration: needs the docker compose stack running (make up)",
    "ml: needs the ML libraries (uv sync installs them; deselected from the fast unit run)",
]
addopts = "-m 'not integration and not ml'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes/**/upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["mirage_schema", "mirage_pipeline", "mirage_policy", "mirage_decoy_common", "mirage_profiles", "mirage_tokens", "mirage_http_decoy", "mirage_db_decoy", "mirage_lab"]

[tool.ruff.lint.per-file-ignores]
# Tests and spikes embed long SQL and JSON strings.
"**/tests/**" = ["S", "E501"]
"tests/**" = ["S", "E501"]
"eval/**" = ["S"]
"spikes/**" = ["S", "E501"]
"tools/**" = ["S", "E501"]
# The experiment scripts print result tables.
"intel/src/mirage_intel/experiments/**" = ["E501"]
# The profile generator and reference extractor are offline dev tools full of template data:
# seeded (not cryptographic) randomness, MariaDB's SHA-1 password hash, docker subprocesses.
"decoys/profiles/**" = ["S", "E501", "E731"]
# Decoys listen on all interfaces of their own container; the networks decide reachability.
"decoys/common/src/**" = ["S104"]
"decoys/ssh/build_fs.py" = ["S301", "S403", "E501"]
# The scenario runner draws everything from seeded generators so a run can be repeated (S311),
# names world-writable directories in the commands it types (S108), and is a client of a
# decoy whose host key it has no reason to check (S507).
"lab/src/**" = ["S311", "S108", "S507"]
# Redis decoy command and reply tables.
"decoys/db/src/mirage_db_decoy/redis/*.py" = ["E501"]
