[project]
name = "mirage-pipeline"
version = "0.1.0"
description = "MIRAGE pipeline: normaliser, sessioniser (sessions, honeytokens, actor links), artifact indexer"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["mirage-schema", "mirage-tokens", "nats-py>=2.9", "httpx>=0.28", "puremagic>=1.28"]

[project.scripts]
mirage-normaliser = "mirage_pipeline.normaliser:main"
mirage-sessioniser = "mirage_pipeline.sessioniser:main"
mirage-artifact-indexer = "mirage_pipeline.artifacts:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage_pipeline"]

[tool.uv.sources]
mirage-schema = { workspace = true }
mirage-tokens = { workspace = true }
